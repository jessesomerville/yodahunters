name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: stable
        cache: true
    - run: go build -v ./...
    - run: go test -v ./...

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy to VM
      run: |
        gcloud compute scp /tmp/yodahunters-deploy.tar.gz yodahunters:/tmp/yodahunters-deploy.tar.gz \
          --zone us-central1-a --tunnel-through-iap
        gcloud compute ssh yodahunters \
          --zone us-central1-a --tunnel-through-iap \
          --command '
            sudo tailscale serve off
            sudo tailscale down
            sudo systemctl icecast2 stop
            sudo cp ./config/Caddyfile /etc/caddy/Caddyfile
            sudo systemctl caddy reload
          '
